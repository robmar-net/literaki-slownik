    Dziewięć tematów obok „morza”: zwierzęta, rośliny, medycyna i ciało, muzyka, kuchnia, sport,
    matematyka, pogoda, grzyby. Metoda tematy-v1 (#11, ADR-010/011) z ręcznymi dodatkami (warstwa D,
