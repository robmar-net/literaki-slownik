task:
  title: "TEMATY: pilotaż słownika „morze” (#11)"
  issue: 11
  repo: robmar-net/literaki-slownik
  description: >-
    Pilotaż słownika tematycznego „morze” w pakiecie TEMATY (#11). ADR-010 (metoda tematy-v1)
    i ADR-011 (źródła Słowosieć 4.5 i IATE). Pobranie Słowosieci 4.5 i IATE TBX 2019 poza Git
    (źródło, data, SHA-256). Podkomenda generatora według wzoru POP00 (#10), wsadowa i
    deterministyczna. Plik konfiguracji tematu „morze”. Warstwy T1 (etykiety SGJP), T2
    (Słowosieć), T3 (IATE). Raport przecięć z POP i POP00 (% względem tematu i liczby
    bezwzględne, osobno dla warstw) oraz diagnostyka kandydatów przed ∩ STANDARD wobec BROAD i
    STANDARD z przykładami odrzuconych. Kontrolny pomiar pokrycia T2. Kontrola, czy dziedzina
    IATE 4821 nie wciąga żeglugi śródlądowej. Bramka: raport przecięć i 30 słów do przeglądu R2;
    dalszych tematów nie robić przed decyzją operatora.
  constraints:
    - Bez kontaktu z autorami zasobów i innymi grupami.
    - Wikisłownik odroczony; bez LLM.
    - Dane surowe poza Git, z przypiętymi SHA-256.
    - Artefakty po polsku, zwięźle; blok TL;DR / Kluczowe decyzje / Otwarte pytania.
    - Nie wymieniać żadnej gry słownej poza Literaki i Kurnik.
    - Po zapisie w .maister/tasks commit i push repozytorium.
    - Praca zmieniająca kryteria/wydanie aktualizuje wiki (docs/runbook-wiki.md).
  status: in_progress
  tags: [tematy, morze, slowosiec, iate]
