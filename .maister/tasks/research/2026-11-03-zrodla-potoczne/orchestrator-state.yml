        - area: "1. Polityka prawna źródeł bez licencji tekstu"
          chosen_approach: "1A: fakty publiczne (liczby, lata, hosty, URL + własny opis); opt-out sprawdzany na hostach wszystkich trafień kandydata; stan w dniu pomiaru, ponownie przed wpisem"
